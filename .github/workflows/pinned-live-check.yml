name: One-off public demo functional QA
on:
  push:
    branches: [review/i18n-pt-en-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/pinned-live-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-live-qa
          path: test-results/pinned-live/
          if-no-files-found: ignore
          retention-days: 7
