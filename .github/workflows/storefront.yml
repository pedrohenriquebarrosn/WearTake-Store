name: WearTake storefront recovery
on:
  push:
    branches:
      - fix/restore-store-20261012
      - review/deep-code-audit-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/index.js
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weartake-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
